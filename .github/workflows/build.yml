name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: TeamCapacityPlanner-win-x64.exe
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_name: TeamCapacityPlanner-macos-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Install electron-packager
        run: npm install --save-dev electron-packager

      - name: Package Electron app
        run: npx electron-packager . "TeamCapacityPlanner" --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=release --overwrite

      - name: Rename Windows exe
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Path release -Directory | Where-Object { $_.Name -like "TeamCapacityPlanner-*" } | Select-Object -First 1
          Copy-Item "release/$($folder.Name)/TeamCapacityPlanner.exe" "release/${{ matrix.artifact_name }}"

      - name: Create macOS zip
        if: matrix.platform == 'darwin'
        run: |
          cd release
          zip -r "${{ matrix.artifact_name }}" TeamCapacityPlanner-darwin-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
